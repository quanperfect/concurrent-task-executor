name: C++ correctness
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release, clang-debug, clang-tsan, clang-asan-ubsan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang libgtest-dev python3
      # Sanitizer runtimes can fail to start with the runner's high ASLR entropy.
      - name: Reduce ASLR entropy for sanitizers
        if: contains(matrix.preset, 'san')
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false
      - name: Build as a dependency without test packages
        run: |
          cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false
      - name: Check C++ formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format-18 --dry-run --Werror
